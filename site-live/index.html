:root {

y\" }, { i: \"social-skincare\" }, { v: \"dumplings\" }, { i: \"floral-lift\" }, { i: \"brand-kit-marble\" }];\n\n  const onMove = (e) => {\n    const el = wallRef.current;\n    if (!el) return;\n    const r = e.currentTarget.getBoundingClientRect();\n    const px = (e.clientX - r.left) / r.width - 0.5;\n    const py = (e.clientY - r.top) / r.height - 0.5;\n    el.style.transform = \"rotate(-4deg) scale(1.07) translate(\" + (px * -20).toFixed(1) + \"px,\" + (py * -16).toFixed(1) + \"px)\";\n  };\n  const onLeave = () => {\n    const el = wallRef.current;\n    if (el) el.style.transform = \"rotate(-4deg) scale(1.07)\";\n  };\n\n  const colStyle = (anim) => ({\n    flex: 1,\n    display: \"flex\",\n    flexDirection: \"column\",\n    gap: 18,\n    animation: anim,\n    willChange: \"transform\",\n  });\n\n  return (\n    <section style={{ position: \"relative\", background: \"var(--green-forest)\", color: \"var(--cream-3)\", overflow: \"hidden\" }}>\n      {/* Drifting ambient chrome-green glows (soft, no hard edge) */}\n      <div aria-hidden=\"true\" style={{ position: \"absolute\", inset: 0, overflow: \"hidden\", zIndex: 0, pointerEvents: \"none\" }}>\n        <div style={{ position: \"absolute\", width: 600, height: 600, left: \"-10%\", top: \"-26%\", background: \"radial-gradient(circle at 50% 50%, rgba(157,178,159,.40), rgba(157,178,159,0) 68%)\", filter: \"blur(34px)\", animation: \"driftA 24s ease-in-out infinite\" }} />\n        <div style={{ position: \"absolute\", width: 660, height: 660, left: \"26%\", bottom: \"-34%\", background: \"radial-gradient(circle at 50% 50%, rgba(70,102,78,.50), rgba(70,102,78,0) 66%)\", filter: \"blur(38px)\", animation: \"driftB 30s ease-in-out infinite\" }} />\n      </div>\n\n      <div\n        style={{\n          position: \"relative\",\n          zIndex: 1,\n          maxWidth: 1180,\n          margin: \"0 auto\",\n          padding: \"104px 40px 98px\",\n          display: \"grid\",\n          gridTemplateColumns: \"1.04f ividers.\nfunction TrustStrip() {\n  const items = [\"Skin studios & med spas\", \"Nail & beauty\", \"Caf\u00e9s & brunch\", \"Restaurants\", \"Product & retail\", \"Home & lifestyle\"];\n  const [paused, setPaused] = React.useState(false);\n  const Diamond = () => (\n    <span\n      aria-hidden=\"true\"\n      style={{\n        width: 7,\n        height: 7,\n        flex: \"none\",\n        transform: \"rotate(45deg)\",\n        background: \"linear-gradient(135deg,#2E4435,#9DB29F,#F4F2EA)\",\n        backgroundSize: \"200% 200%\",\n        animation: \"chromeSweep 4s linear infinite\",\n        borderRadius: 1,\n      }}\n    />\n  );\n  const Track = ({ keyOffset }) => (\n    <div style={{ display: \"flex\", alignItems: \"center\", gap: 22, flex: \"none\", paddingRight: 22 }}>\n      {items.map((t, i) => (\n        <span key={keyOffset + \"-\" + i} style={{ display: \"inline-flex\", alignItems: \"center\", gap: 22, flex: \"none\" }}>\n          <span style={{ fontFamily: \"var(--font-serif)\", fontSize: 16.5, color: \"var(--ink-soft)\", whiteSpace: \"nowrap\" }}>{t}</span>\n          <Diamond />\n        </span>\n      ))}\n    </div>\n  );\n  return (\n    <section style={{ background: \"var(--cream)\", borderBottom: \"1px solid var(--line)\" }}>\n      <div\n        style={{\n          maxWidth: 1180,\n          margin: \"0 auto\",\n          padding: \"26px 40px\",\n          display: \"flex\",\n          alignItems: \"center\",\n          gap: 28,\n        }}\n      >\n        <span\n          style={{\n            fontFamily: \"var(--font-sans)\",\n            fontWeight: 600,\n            fontSize: 11,\n            letterSpacing: \".26em\",\n            textTransform: \"uppercase\",\n            color: \"var(--ink-faint)\",\n            flex: \"none\",\n          }}\n        >\n          Built for\n        </span>\n        <div\n          onMouseEnter={() => setPaused(true)}\n          onMouseLeave={() => setPaused(false)}\n          style={{ flex: 1, overflow: \"hidden\", position: \"relative\", maskImage: \"linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent)\", WebkitMaskImage: \"linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent)\" }}\n        >\n          <div\n            style={{\n              display: \"flex\",\n              width: \"max-content\",\n              animation: \"marquee 34s linear infinite\",\n              animationPlayState: paused ? \"paused\" : \"running\",\n            }}\n          >\n            <Track keyOffset=\"a\" />\n            <Track keyOffset=\"b\" />\n          </div>\n        </div>\n      </div>\n    </section>\n  );\n}\n", "Services": "// Lift Studio marketing site \u2014 Services\n// The four offerings as the brand's signature numbered editorial rows.\nfunction Services() {\n  const rows = [\n    { n: 1, title: \"First-Impression Audits\", promise: \"Where you're losing trust \u2014 and the fastest fixes.\", body: \"Website and social review, first-impression notes, your fastest quick wins, and a clear recommended next step.\" },\n    { n: 2, title: \"SEO Audits\", promise: \"Why customers can't find you \u2014 and how to fix it.\", body: \"Search-visibility review, local and Google Business Profile checks, keyword and on-page gaps, and a prioritized fix list you can actually act on.\" },\n    { n: 3, title: \"Brand Foundation\", promise: \"The identity everything else is built on.\", body: \"Logo direction and lockups, a color and type system, a simple usage guide, and real-world application.\" },\n    { n: 4, title: \"Monthly Content Kits\", promise: \"A steady stream of content, ready to use.\", body: \"UGC-style video and carousel concepts, caption hooks, a monthly content calendar, and pinned-post direction.\" },\n    { n: 5, title: \"\u00c0 la Carte Pieces\", promise: \"When you need just one thing, not a kit.\", body: \"Instagram refreshes, carousel and UGC script packs, caption banks, brand mini-guides, and content calendars.\" },\n  ] ((c, i) => (\n            <Reveal key={i} delay={(i % 4) * 70 + Math.floor(i / 4) * 60}>\n            <div\n              onMouseEnter={() => setHover(i)}\n              onMouseLeave={() => setHover(-1)}\n              style={{ cursor: \"default\" }}\n            >\n              <div\n                style={{\n                  height: 230,\n                  borderRadius: \"var(--radius-md)\",\n                  overflow: \"hidden\",\n                  background: \"var(--stone-2)\",\n                  boxShadow: hover === i ? \"var(--shadow-card)\" : \"var(--shadow-sm)\",\n                  transform: hover === i ? \"translateY(-4px)\" : \"none\",\n                  transition: \"transform var(--dur-base) var(--ease-soft), box-shadow var(--dur-base) var(--ease-soft)\",\n                }}\n              >\n                <img src={R(c.img)} alt={c.title} style={{ width: \"100%\", height: \"100%\", objectFit: \"cover\", objectPosition: c.pos || \"center\", display: \"block\", transform: hover === i ? \"scale(1.05)\" : \"scale(1)\", transition: \"transform 640ms var(--ease-soft)\" }} />\n              </div>\n              <div style={{ display: \"inline-block\", position: \"relative\", marginTop: 14 }}>\n                <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 15, color: hover === i ? \"var(--green-pine)\" : \"var(--ink)\", transition: \"color var(--dur-base) var(--ease-soft)\" }}>{c.title}</div>\n                <span\n                  aria-hidden=\"true\"\n                  style={{\n                    position: \"absolute\",\n                    left: 0,\n                    bottom: -4,\n                    height: 2,\n                    width: hover === i ? \"100%\" : \"0%\",\n                    borderRadius: 2,\n                    background: \"linear-gradient(90deg,#3B5742,#9DB29F,#F4F2EA)\",\n                    backgroundSize: \"200% 100%\",\n                    animation: hover === i ? \"chromeSweep 3s linear infinite\" : \"none\",\n                    transition: \"width 380ms var(--ease-soft)\",\n                  }}\n                />\n              </div>\n              <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 13, color: \"var(--ink-faint)\", marginTop: 3 }}>{c.sub}</div>\n            </div>\n            </Reveal>\n          ))}\n        </div>\n      </div>\n    </section>\n  );\n}\n", "CaseStudy": "// Lift Studio marketing site \u2014 CaseStudy\n// Juniper Skin Studio concept build. Draggable before/after sliders show the\n// leap from a customer's real careless phone photo to a fully reimagined,\n// art-directed shot of the same subject \u2014 the point being vision, not retouching.\n// A deliverables rail underneath shows the full rebuild (brand, homepage, content).\nfunction BeforeAfter({ before, after, tag, note }) {\n  const [pos, setPos] = React.useState(54);\n  const [touched, setTouched] = React.useState(false);\n  const ref = React.useRef(null);\n  const drag = React.useRef(false);\n\n  const fromX = (clientX) => {\n    const el = ref.current;\n    if (!el) return;\n    const r = el.getBoundingClientRect();\n    let p = ((clientX - r.left) / r.width) * 100;\n    p = Math.max(2, Math.min(98, p));\n    setPos(p);\n  };\n  const down = (e) => { drag.current = true; setTouched(true); if (ref.current.setPointerCapture) ref.current.setPointerCapture(e.pointerId); fromX(e.clientX); };\n  const move = (e) => { if (drag.current) fromX(e.clientX); };\n  const up = () => { drag.current = false; };\n\n  const pill = (extra) => ({\n    position: \"absolute\",\n    top: 14,\n    padding: \"6px 12px\",\n    borderRadius: 999,\n    fontFamily: \"var(--font-sans)\",\n    fontWeight: 600,\n    fontSize: 10.5,\n    letterSpacing: \".14em\",\n    textTransform: \"uppercase\",\n    backdropFilter: \"blur(6px)\",\n    WebkitBackdropFilter: \"blur(6px)\",\n    pointerEvents: \"none\",\n    ...extra,\n  });\n\n  return (\n    <div>\n      <div\n        ref={ref}\n        onPointerDown={down}\n        onPointerMove={move}\n        onPointerUp={up}\n        onPointerCancel={up}\n        style={{ position: \"relative\", aspectRatio: \"4 / 5\", borderRadius: 14, overflow: \"hidden\", cursor: \"ew-resize\", userSelect: \"none\", touchAction: \"none\", background: \"#1b2820\", boxShadow: \"0 24px 54px rgba(6,12,8,.5)\" }}\n      >\n        {/* After (full) */}\n        <img src={after} draggable=\"false\" style={{ position: \"absolute\", inset: 0, width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" }} />\n        {/* Before (clipped from the right) */}\n        <div style={{ position: \"absolute\", inset: 0, clipPath: \"inset(0 \" + (100 - pos) + \"% 0 0)\", WebkitClipPath: \"inset(0 \" + (100 - pos) + \"% 0 0)\" }}>\n          <img src={before} draggable=\"false\" style={{ position: \"absolute\", inset: 0, width: \"100%\", height: \"100%\", objectFit: \"cover\", display: \"block\" }} />\n        </div>\n\n        <span style={pill({ left: 14, background: \"rgba(20,22,16,.5)\", color: \"var(--cream-3)\" })}>Before</span>\n        <span style={pill({ right: 14, background: \"rgba(46,68,53,.62)\", color: \"var(--cream-2)\" })}>Lifted</span>\n\n        {/* Handle */}\n        <div style={{ position: \"absolute\", top: 0, bottom: 0, left: pos + \"%\", width: 2, background: \"linear-gradient(180deg,#EDEBE2,#9DB29F,#EDEBE2)\", transform: \"translateX(-1px)\", pointerEvents: \"none\" }}>\n          <div style={{ position: \"absolute\", top: \"50%\", left: \"50%\", transform: \"translate(-50%,-50%)\", width: 44, height: 44, borderRadius: \"50%\", background: \"linear-gradient(100deg,#F4F2EA,#FFFFFF,#CBD7C5,#9DB29F,#F4F2EA)\", backgroundSize: \"220% 100%\", animation: \"chromeSweep 3s linear infinite\", boxShadow: \"0 8px 20px rgba(0,0,0,.42)\", display: \"flex\", alignItems: \"center\", justifyContent: \"center\", gap: 3, color: \"#2E4435\", fontSize: 13, fontWeight: 800 }}>\n            <span>\u2039</span><span>\u203a</span>\n          </div>\n        </div>\n\n        {/* Drag hint, fades after first interaction */}\n        <div style={{ position: \"absolute\", bottom: 14, left: \"50%\", transform: \"translateX(-50%)\", padding: \"7px 14px\", borderRadius: 999, background: \"rgba(20,22,16,.5)\", backdropFilter: \"blur(6px)\", WebkitBackdropFilter: \"blur(6px)\", fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 11, letterSpacing: \".12em\", textTransform: \"uppercase\", color: \"var(--cream-3)\", opacity: touched ? 0 : 1, transition: \"opacity 400ms var(--ease-soft)\", pointerEvents: \"none\" }}>\n          Drag to compare\n        </div>\n      </div>\n\n      <div style={{ marginTop: 18 }}>\n        <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 12, letterSpacing: \".2em\", textTransform: \"uppercase\", color: \"var(--green-sage)\" }}>{tag}</div>\n        <p style={{ margin: \"8px 0 0\", fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 14.5, lineHeight: 1.58, color: \"var(--green-mist-2)\" }}>{note}</p>\n      </div>\n    </div>\n  );\n}\n\nfunction DeliverCard({ src, label, note }) {\n  const [h, setH] = React.useState(false);\n  return (\n    <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{ cursor: \"default\" }}>\n      <div style={{ height: 168, borderRadius: 10, overflow: \"hidden\", boxShadow: h ? \"0 20px 42px rgba(6,12,8,.5)\" : \"0 10px 24px rgba(6,12,8,.34)\", outline: \"1px solid \" + (h ? \"var(--green-sage-2)\" : \"rgba(157,178,159,.18)\"), transform: h ? \"translateY(-4px)\" : \"none\", transition: \"transform var(--dur-base) var(--ease-soft), box-shadow var(--dur-base) var(--ease-soft), outline-color var(--dur-base)\" }}>\n        <img src={src} alt={label} style={{ width: \"100%\", height: \"100%\", objectFit: \"cover\", objectPosition: \"top center\", display: \"block\", transform: h ? \"scale(1.04)\" : \"scale(1)\", transition: \"transform 600ms var(--ease-soft)\" }} />\n      </div>\n      <div style={{ marginTop: 12, fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 14, color: \"var(--cream-2)\" }}>{label}</div>\n      <div style={{ marginTop: 2, fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 12.5, color: \"var(--green-sage)\" }}>{note}</div>\n    </div>\n  );\n}\n\nfunction CaseStudy({ onAudit }) {\n  const pairs = [\n    { before: R(\"../../assets/before-room.png\"),     after: R(\"../../assets/after-room.png\"),     tag: \"The treatment room\", note: \"Same room, same corner \u2014 reshot to feel like the calm you actually walk into. Light, styling, and a point of view do the work.\" },\n    { before: R(\"../../assets/before-products.png\"), after: R(\"../../assets/after-products.png\"), tag: \"The product line\",    note: \"Same products off the same shelf \u2014 reimagined as one overhead story, with light and shadow doing the selling.\" },\n  ];\n  const delivers = [\n    { src: R(\"../../assets/juniper-brand-board.png\"),  label: \"Brand system\",   note: \"Logo, palette, type\" },\n    { src: R(\"../../assets/juniper-homepage.png\"),     label: \"Homepage\",       note: \"First impression, rebuilt\" },\n    { src: R(\"../../assets/juniper-content-menu.png\"), label: \"Content engine\", note: \"A month, planned out\" },\n  ];\n\n  return (\n    <section id=\"work\" style={{ position: \"relative\", background: \"var(--green-forest)\", color: \"var(--cream-3)\", overflow: \"hidden\" }}>\n      <div aria-hidden=\"true\" style={{ position: \"absolute\", inset: 0, overflow: \"hidden\", zIndex: 0, pointerEvents: \"none\" }}>\n        <div style={{ position: \"absolute\", width: 620, height: 620, right: \"-12%\", top: \"-20%\", background: \"radial-gradient(circle at 50% 50%, rgba(157,178,159,.30), rgba(157,178,159,0) 68%)\", filter: \"blur(40px)\", animation: \"driftB 26s ease-in-out infinite\" }} />\n      </div>\n\n      <div style={{ position: \"relative\", zIndex: 1, maxWidth: 1180, margin: \"0 auto\", padding: \"98px 40px 104px\" }}>\n        <Reveal>\n          <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 12, letterSpacing: \".34em\", textTransform: \"uppercase\", color: \"var(--green-sage)\", marginBottom: 22 }}>\n            Case study \u00b7 sample work\n          </div>\n          <div style={{ display: \"flex\", justifyContent: \"space-between\", alignItems: \"flex-end\", gap: 48, flexWrap: \"wrap\", marginBottom: 50 }}>\n            <h2 style={{ margin: 0, maxWidth: 640, fontFamily: \"var(--font-serif)\", fontWeight: 300, fontSize: 52, lineHeight: 1.04, letterSpacing: \"-.01em\", color: \"var(--cream-2)\" }}>\n              Same business.<br /><ChromeText light speed={7} style={{ fontStyle: \"italic\", fontWeight: 400 }}>A whole new vision.</ChromeText>\n            </h2>\n            <p style={{ margin: 0, maxWidth: 430, fontFamily: \"var(--font-sans)\", fontSize: 16, lineHeight: 1.66, color: \"var(--green-mist-2)\" }}>\n              Juniper Skin Studio is a sample of our work. We don't just clean up your photos \u2014 we give the whole thing a point of view: how it's shot, what it says, and how it all fits together.\n            </p>\n          </div>\n        </Reveal>\n\n        <div style={{ display: \"grid\", gridTemplateColumns: \"repeat(2,1fr)\", gap: 30, maxWidth: 940, margin: \"0 auto\" }}>\n          {pairs.map((p, i) => (\n            <Reveal key={i} delay={i * 90}>\n              <BeforeAfter before={p.before} after={p.after} tag={p.tag} note={p.note} />\n            </Reveal>\n          ))}\n        </div>\n\n        {/* Deliverables rail */}\n        <Reveal delay={120}>\n          <div style={{ marginTop: 72, paddingTop: 40, borderTop: \"1px solid var(--line-on-dark)\" }}>\n            <div style={{ display: \"flex\", justifyContent: \"space-between\", alignItems: \"flex-end\", gap: 32, flexWrap: \"wrap\", marginBottom: 30 }}>\n              <h3 style={{ margin: 0, maxWidth: 560, fontFamily: \"var(--font-serif)\", fontWeight: 300, fontSize: 28, lineHeight: 1.2, color: \"var(--cream-2)\" }}>\n                And we didn't stop at the photos.\n              </h3>\n              <p style={{ margin: 0, maxWidth: 360, fontFamily: \"var(--font-sans)\", fontSize: 14.5, lineHeight: 1.6, color: \"var(--green-mist-2)\" }}>\n                One concept, carried all the way through \u2014 the brand, the homepage, and a month of content built to match.\n              </p>\n            </div>\n            <div style={{ display: \"grid\", gridTemplateColumns: \"repeat(3,1fr)\", gap: 24 }}>\n              {delivers.map((d, i) => <DeliverCard key={i} src={d.src} label={d.label} note={d.note} />)}\n            </div>\n          </div>\n        </Reveal>\n\n        <Reveal delay={80}>\n          <div style={{ display: \"flex\", alignItems: \"center\", gap: 18, flexWrap: \"wrap\", marginTop: 48 }}>\n            <ChromeButton variant=\"cream\" onClick={onAudit}>See this for your business</ChromeButton>\n            <span style={{ fontFamily: \"var(--font-serif)\", fontStyle: \"italic\", fontSize: 17, color: \"var(--green-mist)\" }}>Start with a Mini-Audit \u2014 we'll show you the first wins.</span>\n          </div>\n        </Reveal>\n      </div>\n    </section>\n  );\n}\n", "About": "// Lift Studio marketing site \u2014 About\n// Studio section: positioning and background, no named founder yet.\nfunction About() {\n  return (\n    <section id=\"about\" style={{ background: \"var(--cream)\" }}>\n      <div style={{ maxWidth: 1180, margin: \"0 auto\", padding: \"92px 40px 96px\" }}>\n      <Reveal>\n        <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 12, letterSpacing: \".34em\", textTransform: \"uppercase\", color: \"var(--green-pine)\", marginBottom: 22 }}>Who's behind it</div>\n        <h2 style={{ margin: \"0 0 48px\", fontFamily: \"var(--font-serif)\", fontWeight: 400, fontSize: 46, lineHeight: 1.05, letterSpacing: \"-.01em\", color: \"var(--ink)\" }}>About Lift Studio</h2>\n      </Reveal>\n\n        <div style={{ maxWidth: 760 }}>\n          <Reveal delay={60}>\n          <p style={{ margin: \"0 0 16px\", fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 18, lineHeight: 1.68, color: \"var(--ink-body)\" }}>\n            Lift Studio is led by a brand and content strategist with 10 years of experience in Manhattan working across some of the country's biggest brands and some of its scrappiest startups. We know what it looks like when a brand is built right \u2014 and what it costs when it isn't.\n          </p>\n          <p style={{ margin: \"0 0 16px\", fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 18, lineHeight: 1.68, color: \"var(--ink-body)\" }}>\n            Now based in Central PA, Lift Studio started with a specific gap in mind: local and regional service businesses doing excellent work that their online presence doesn't reflect. The strategy and creative standards we applied to national brands translate directly.\n          </p>\n          <p style={{ margin: 0, fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 18, lineHeight: 1.68, color: \"var(--ink-body)\" }}>\n            The result is brand and content work that looks like it came from a big-city agency and feels like it was made for your specific business \u2014 because it was.\n          </p>\n          </Reveal>\n\n          <Reveal delay={120}>\n          <div style={{ position: \"relative\", background: \"var(--green-forest)\", borderRadius: \"var(--radius-lg)\", padding: \"32px 40px\", marginTop: 36, overflow: \"hidden\" }}>\n            <span aria-hidden=\"true\" style={{ position: \"absolute\", top: 0, left: 0, right: 0, height: 3, background: \"linear-gradient(90deg,#2E4435,#9DB29F,#F4F2EA,#CBD7C5,#3B5742)\", backgroundSize: \"250% 100%\", animation: \"chromeSweep 5s linear infinite\" }} />\n            <p style={{ margin: 0, fontFamily: \"var(--font-serif)\", fontStyle: \"italic\", fontWeight: 300, fontSize: 26, lineHeight: 1.38, color: \"var(--cream-2)\" }}>\n              \u201cWe know what it looks like when a brand is built right \u2014 and what it costs when it isn't.\u201d\n            </p>\n            <div style={{ marginTop: 24, paddingTop: 20, borderTop: \"1px solid rgba(237,235,226,.18)\", display: \"flex\", gap: 28, flexWrap: \"wrap\", fontFamily: \"var(--font-sans)\", fontWeight: 500, fontSize: 12, letterSpacing: \".12em\", textTransform: \"uppercase\", color: \"var(--green-sage)\" }}>\n              <span>10 years in Manhattan</span>\n              <span>National brands &amp; startups</span>\n              <span>Now working local</span>\n            </div>\n          </div>\n          </Reveal>\n        </div>\n      </div>\n    </section>\n  );\n}\n", "CTA": "// Lift Studio marketing site \u2014 CTA\n// Forest closing panel with three ways to start + inline contact form.\nfunction CTA({ open, onAudit, formRef }) {\n  const [sent, setSent] = React.useState(false);\n  const ways = [\n    { n: 1, t: \"Request a Mini-Audit\" },\n    { n: 2, t: \"Start monthly with the Content Bank\" },\n    { n: 3, t: \"Reply with a question\" },\n  ];\n  return (\n    <section id=\"contact\" ref={formRef} style={{ background: \"var(--green-forest)\", color: \"var(--cream-3)\" }}>\n      <div style={{ maxWidth: 1180, margin: \"0 auto\", padding: \"96px 40px 100px\" }}>\n        <div style={{ display: \"grid\", gridTemplateColumns: \"1fr 1fr\", gap: 64, alignItems: \"start\" }}>\n          <Reveal>\n          <div>\n            <div style={{ width: 46, height: 1, background: \"var(--green-sage-2)\", marginBottom: 30 }} />\n            <h2 style={{ margin: 0, fontFamily: \"var(--font-serif)\", fontWeight: 300, fontSize: 52, lineHeight: 1.08, letterSpacing: \"-.015em\", color: \"var(--cream-2)\" }}>\n              Ready to see what this looks like for <ChromeText light speed={7} style={{ fontStyle: \"italic\" }}>your business?</ChromeText>\n            </h2>\n            <p style={{ margin: \"34px 0 0\", maxWidth: 480, fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 17, lineHeight: 1.72, color: \"var(--green-mist-2)\" }}>\n              We start with a Mini-Audit \u2014 a deep review of your website and social, your fastest wins, and a clear recommended next step. From there, you decide if monthly support makes sense.\n            </p>\n            <div style={{ marginTop: 40 }}>\n              <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 12, letterSpacing: \".28em\", textTransform: \"uppercase\", color: \"var(--green-sage)\", marginBottom: 6 }}>Three ways to start</div>\n              {ways.map((w, i) => (\n                <div key={w.n} style={{ display: \"flex\", gap: 22, padding: \"22px 0\", borderTop: \"1px solid rgba(237,235,226,.16)\", borderBottom: i === ways.length - 1 ? \"1px solid rgba(237,235,226,.16)\" : \"none\", alignItems: \"baseline\" }}>\n                  <span style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 13, color: \"var(--green-sage)\", flex: \"none\", width: 24 }}>{String(w.n).padStart(2, \"0\")}</span>\n                  <span style={{ fontFamily: \"var(--font-sans)\", fontWeight: 500, fontSize: 18, color: \"var(--cream-3)\" }}>{w.t}</span>\n                </div>\n              ))}\n            </div>\n          </div>\n          </Reveal>\n\n          <Reveal delay={120}>\n          <div\n            style={{\n              position: \"relative\",\n              overflow: \"hidden\",\n              background: \"var(--cream)\",\n              borderRadius: \"var(--radius-lg)\",\n              padding: 34,\n              boxShadow: \"var(--shadow-deep)\",\n              outline: open ? \"2px solid var(--green-sage)\" : \"none\",\n              outlineOffset: 4,\n              transition: \"outline var(--dur-base) var(--ease-soft)\",\n            }}\n          >\n            <span aria-hidden=\"true\" style={{ position: \"absolute\", top: 0, left: 0, right: 0, height: 3, background: \"linear-gradient(90deg,#2E4435,#9DB29F,#F4F2EA,#CBD7C5,#3B5742)\", backgroundSize: \"250% 100%\", animation: \"chromeSweep 5s linear infinite\" }} />\n            {!sent ? (\n              <React.Fragment>\n                <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 12, letterSpacing: \".24em\", textTransform: \"uppercase\", color: \"var(--green-pine)\", marginBottom: 18 }}>Request your Mini-Audit</div>\n                <Field label=\"Your name\" placeholder=\"Jane Doe\" />\n                <Field label=\"Business\" placeholder=\"Juniper Skin Studio\" />\n                <Field label=\"Website or Instagram\" placeholder=\"@juniperskin\" />\n                <Field label=\"What's not working?\" placeholder=\"Our site doesn't match the work we do\u2026\" textarea />\n                <ChromeButton variant=\"forest\" onClick={() => setSent(true)} style={{ width: \"100%\", marginTop: 8, fontSize: 13.5 }}>Send request</ChromeButton>\n              </React.Fragment>\n            ) : (\n              <div style={{ padding: \"40px 8px\", textAlign: \"center\" }}>\n                <div style={{ fontFamily: \"var(--font-serif)\", fontWeight: 400, fontSize: 30, lineHeight: 1.12, color: \"var(--ink)\" }}>Thank you \u2014<br /><span style={{ fontStyle: \"italic\", color: \"var(--green-pine)\" }}>we'll be in touch.</span></div>\n                <p style={{ margin: \"18px auto 24px\", maxWidth: 320, fontFamily: \"var(--font-sans)\", fontSize: 14.5, lineHeight: 1.6, color: \"var(--ink-muted)\" }}>\n                  We review every request personally and reply within two business days with your first-impression notes.\n                </p>\n                <button onClick={() => setSent(false)} style={{ fontFamily: \"var(--font-serif)\", fontStyle: \"italic\", fontSize: 17, color: \"var(--green-pine)\", background: \"none\", border: \"none\", cursor: \"pointer\" }}>Send another \u2192</button>\n              </div>\n            )}\n          </div>\n          </Reveal>\n        </div>\n      </div>\n    </section>\n  );\n}\n\nfunction Field({ label, placeholder, textarea }) {\n  const [focus, setFocus] = React.useState(false);\n  const base = {\n    width: \"100%\",\n    boxSizing: \"border-box\",\n    fontFamily: \"var(--font-sans)\",\n    fontSize: 14.5,\n    color: \"var(--ink)\",\n    background: \"var(--cream)\",\n    border: \"1px solid \" + (focus ? \"var(--green-pine)\" : \"var(--line)\"),\n    borderRadius: \"var(--radius-md)\",\n    padding: \"12px 14px\",\n    outline: \"none\",\n    transition: \"border var(--dur-base) var(--ease-soft)\",\n    resize: \"none\",\n  };\n  return (\n    <label style={{ display: \"block\", marginBottom: 16 }}>\n      <span style={{ display: \"block\", fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 10.5, letterSpacing: \".18em\", textTransform: \"uppercase\", color: \"var(--ink-faint)\", marginBottom: 7 }}>{label}</span>\n      {textarea ? (\n        <textarea rows={3} placeholder={placeholder} style={base} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} />\n      ) : (\n        <input placeholder={placeholder} style={base} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} />\n      )}\n    </label>\n  );\n}\n", "Footer": "// Lift Studio marketing site \u2014 Footer\nfunction Footer() {\n  const [wm, setWm] = React.useState(false);\n  return (\n    <footer style={{ background: \"var(--ink)\", color: \"var(--green-mist-2)\" }}>\n      <div style={{ maxWidth: 1180, margin: \"0 auto\", padding: \"52px 40px\", display: \"flex\", justifyContent: \"space-between\", alignItems: \"flex-end\", gap: 40, flexWrap: \"wrap\" }}>\n        <div>\n          <div\n            onMouseEnter={() => setWm(true)}\n            onMouseLeave={() => setWm(false)}\n            style={{\n              display: \"inline-block\",\n              fontFamily: \"var(--font-sans)\",\n              fontWeight: 600,\n              fontSize: 18,\n              letterSpacing: \".32em\",\n              textTransform: \"uppercase\",\n              paddingLeft: \".32em\",\n              cursor: \"default\",\n              background: wm ? \"linear-gradient(100deg,#EDEBE2,#9DB29F,#F7F5EE,#CBD7C5,#8AA68E,#F7F5EE)\" : \"none\",\n              backgroundSize: \"250% 100%\",\n              WebkitBackgroundClip: wm ? \"text\" : \"border-box\",\n              backgroundClip: wm ? \"text\" : \"border-box\",\n              color: wm ? \"transparent\" : \"var(--cream-2)\",\n              WebkitTextFillColor: wm ? \"transparent\" : \"var(--cream-2)\",\n              animation: wm ? \"chromeSweep 2.6s linear infinite\" : \"none\",\n              transition: \"color var(--dur-base) var(--ease-soft)\",\n            }}\n          >Lift&nbsp;Studio</div>\n          <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 400, fontSize: 13, color: \"var(--ink-faint)\", marginTop: 12, maxWidth: 360, lineHeight: 1.6 }}>\n            Brand &amp; content strategy \u2014 national standards for local businesses. Central PA.\n          </div>\n        </div>\n        <div style={{ textAlign: \"right\" }}>\n          <div style={{ fontFamily: \"var(--font-sans)\", fontWeight: 600, fontSize: 11, letterSpacing: \".24em\", textTransform: \"uppercase\", color: \"var(--green-sage)\", marginBottom: 8 }}>Get in touch</div>\n          <a href=\"mailto:megan@helloliftstudio.com\" onMouseEnter={(e) => (e.currentTarget.style.color = \"var(--green-mist)\")} onMouseLeave={(e) => (e.currentTarget.style.color = \"var(--cream-2)\")} style={{ fontFamily: \"var(--font-serif)\", fontStyle: \"italic\", fontSize: 21, color: \"var(--cream-2)\", textDecoration: \"none\", transition: \"color var(--dur-base) var(--ease-soft)\" }}>megan@helloliftstudio.com</a>\n        </div>\n      </div>\n    </footer>\n  );\n}\n", "Home": "// Lift Studio marketing site \u2014 Home\n// Composes the full homepage and owns the \"Request a Mini-Audit\" scroll behavior.\nfunction Home() {\n  const formRef = React.useRef(null);\n  const [pulse, setPulse] = React.useState(false);\n  const onAudit = () => {\n    const el = document.getElementById(\"contact\");\n    if (el) window.scrollTo({ top: el.offsetTop - 40, behavior: \"smooth\" });\n    setPulse(true);\n    setTimeout(() => setPulse(false), 1400);\n  };\n  return (\n    <div style={{ background: \"var(--cream)\" }}>\n      <Header onAudit={onAudit} />\n      <Hero onAudit={onAudit} />\n      <TrustStrip />\n      <Services />\n      <WhoItsFor />\n      <CaseStudy onAudit={onAudit} />\n      <About />\n      <CTA open={pulse} onAudit={onAudit} formRef={formRef} />\n      <Footer />\n    </div>\n  );\n}\n"}</script>
<script>
  // Deterministic JSX loader. The in-browser Babel default flipped to the automatic
  // JSX runtime (emits `import`, unusable in a plain <script>), and its auto-pipeline
  // ignores per-tag preset overrides — so we transform each component ourselves with
  // the CLASSIC runtime and inject it, then mount. Uses inline sources (#jsx-sources)
  // when present (self-contained bundle), else fetches the .jsx files (dev).
  (function () {
    var NAMES = ["Effects","Header","Hero","TrustStrip","Services","WhoItsFor","CaseStudy","About","CTA","Footer","Home"];
    function classic(code) { return Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code; }
    var blobEl = document.getElementById("jsx-sources");
    var inline = blobEl ? JSON.parse(blobEl.textContent) : null;
    (async function () {
      for (var i = 0; i < NAMES.length; i++) {
        var n = NAMES[i];
        var code = inline ? inline[n] : await (await fetch(n + ".jsx")).text();
        var s = document.createElement("script");
        s.textContent = classic(code);
        document.body.appendChild(s);
      }
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.Home));
    })();
  })();
</script>
